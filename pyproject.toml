[project]
name = "frappe_themes"
authors = [
    { name = "Ajish", email = "ajishiyappan1@gmail.com"}
]
description = "Theme catalogue for Frappe Desk and Frappe UI apps"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<18.0.0"
